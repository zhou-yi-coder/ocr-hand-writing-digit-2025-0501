<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>宙翼 OCR 数字识别</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .result-pair {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 0.75rem;
      padding: 0.5rem 0.75rem;
      border: 1px solid #ddd;
      border-radius: 6px;
      background-color: #fefefe;
    }
    .result-pair img {
      max-height: 60px;
      border: 1px solid #ccc;
    }
    .result-pair .text {
      font-size: 1.1rem;
      margin: 0;
    }
  </style>
</head>
<body class="bg-light">
<div style="display: flex; align-items: center; justify-content: center; margin-bottom: 30px;">
    <img src="{{ url_for('static', filename='logo.png') }}" alt="公司 Logo" style="height: 60px; margin-right: 20px;">
    <div>
        <h1 style="margin: 0; font-size: 24px;">苏州宙翼科技有限公司</h1>
        <p style="margin: 0; color: #666;">OCR数字识别DEMO</p>
    </div>
</div>



  <div class="container mt-4">
    <h3 class="mb-3">上传图像识别数字</h3>

    <form method="post" enctype="multipart/form-data" class="mb-4">
      <div class="mb-2">
        <input class="form-control" type="file" name="image" required>
      </div>
      <button type="submit" class="btn btn-primary">开始识别</button>
    </form>

    {% if results %}
      <div class="mb-3"><strong>识别结果：</strong></div>
      {% for r in results %}
        <div class="result-pair">
          <img src="data:image/jpeg;base64,{{ r.image }}" alt="识别图块">
          <p class="text mb-0"> {{ r.text }}</p>
        </div>
      {% endfor %}
    {% endif %}
  </div>
</body>
</html>
